<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f5f0" />
    <script>
      // Saved choice first, otherwise the system setting. Runs before paint to avoid a flash of the wrong theme.
      (function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('spacesense-theme')
          theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        } catch (e) { /* storage blocked: follow the system */ }
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161713')
      })()
    </script>
    <title>SpaceSense – Interior redesign</title>
    <meta name="description" content="Upload your room, set a style and budget in INR, and preview a redesign plan with Vastu-aware guidance." />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="/images/hero.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
